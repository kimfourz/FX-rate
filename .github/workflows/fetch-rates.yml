name: fetch-fx-rates

on:
  schedule:
    # GitHub 시간은 UTC 기준 (한국시간 = UTC + 9시간)
    # GitHub 예약 실행은 몇 시간씩 늦어질 수 있어서 평일엔 세 번 실행한다
    - cron: "25 16 * * 0-4"   # 월~금 01:25 KST
    - cron: "25 18 * * 0-4"   # 월~금 03:25 KST
    - cron: "25 20 * * 0-4"   # 월~금 05:25 KST
    - cron: "25 13 * * 6"     # 토 22:25 KST
    - cron: "25 8 * * 0"      # 일 17:25 KST
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)

# 늦어진 실행들이 한꺼번에 몰려도 하나씩 차례로 돌게 해서 저장(push) 충돌을 막는다
concurrency:
  group: fetch-fx-rates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 환율 조회
        run: python3 fetch_rates.py
        env:
          OXR_APP_ID: ${{ secrets.OXR_APP_ID }}

      - name: rates.json 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git commit -m "update rates $(date -u +%Y-%m-%dT%H:%MZ)" || echo "변경 없음"
          git push
